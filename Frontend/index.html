<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="build-version" content="__BUILD_VERSION__" />
    <!-- Purge legacy service workers (production 503 fix). Do not register sw.js here. -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(
            regs.map(function (r) {
              try { r.update(); } catch (e) { /* ignore */ }
              return r.unregister();
            })
          );
        }).catch(function () {});
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          }).catch(function () {});
        }
      })();
    </script>
    <!-- Optimize Google Fonts by reducing connection setup time -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Life Makers Foundation</title>
    <meta name="description" content="4DX Methodology" />
    <meta name="author" content="Life Makers Foundation" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Life Makers Foundation" />
    <meta property="og:description" content="4DX Methodology" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lifemakers.netlify.app/" />
    <meta property="og:image" content="logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://lifemakers.netlify.app/" />
    <meta name="twitter:title" content="Life Makers Foundation" />
    <meta name="twitter:description" content="4DX Methodology" />
    <meta name="twitter:image" content="logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
