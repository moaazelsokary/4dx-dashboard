[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Netlify default timeout is 10s — beneficiaries + DB cold start need more in production
[functions."beneficiaries-api"]
  timeout = 26

[functions."wig-api"]
  timeout = 26

[functions."auth-session"]
  timeout = 15

[functions."config-api"]
  timeout = 15

[functions."metrics-api"]
  timeout = 15

[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache Control Headers - HTML files (no cache)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

# Service worker must never be cached (otherwise old broken SW keeps running)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

# Cache Control Headers - All HTML files (no cache)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

# Cache Control Headers - Versioned assets (CSS/JS with hash - long cache)
[[headers]]
  for = "/assets/*.{js,css}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache Control Headers - Static assets (images, fonts, etc.)
[[headers]]
  for = "/*.{jpg,jpeg,png,gif,svg,webp,ico,woff,woff2,ttf,eot}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security Headers - All files
[[headers]]
  for = "/*"
  [headers.values]
    # HTTPS Enforcement
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.mapbox.com https://*.powerbi.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.sharepoint.com https://*.microsoft.com https://*.mapbox.com https://*.powerbi.com https://*.netlify.app https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' https://*.powerbi.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    
    # XSS Protection
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    
    # Referrer Policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Permissions Policy
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    
    # Remove server information
    X-Powered-By = ""

# Force HTTPS redirect
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Scheduled Functions
[functions."sync-pms-odoo"]
schedule = "*/10 * * * *"

# Refugees beneficiaries: enqueue daily sync if stale (UTC 02:15); queue worker runs background extract.
[functions."sync-refugees-beneficiaries"]
schedule = "15 2 * * *"

# Process queued admin beneficiaries sync jobs (POST /sync → 202)
[functions."sync-beneficiary-queue"]
schedule = "*/3 * * * *"

# Long-running Odoo extract + SQL rebuild (up to 15 min)
[functions."process-beneficiary-sync-background"]
background = true